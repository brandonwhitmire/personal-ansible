[defaults]
interpreter_python = /usr/bin/python3
log_path = /tmp/ansible.log
stdout_callback = yaml
deprecation_warning = True
display_skipped_hosts = False
host_key_checking = False
# callbacks_enabled = timer, profile_tasks, profile_roles
# debug = True
#vault_password_file = .vault_pass

[connection]
pipelining = True

[ssh_connection]
# NOTE: SSH will prefer password auth
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o CheckHostIP=no -o UpdateHostKeys=no -o LogLevel=quiet -o PreferredAuthentications=password -o ControlMaster=auto -o ControlPersist=1200

[inventory]
unparsed_if_failed = True
