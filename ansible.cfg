[defaults]
interpreter_python = /usr/bin/python3
log_path = /tmp/ansible.log
deprecation_warning = True

host_key_checking = False
vault_password_file = .vault_pass
inventory = hosts

# Performance optimizations
forks = 20
strategy = free
gathering = smart
fact_caching = memory
fact_caching_timeout = 86400
timeout = 30

[connection]
pipelining = True
control_path_dir = /tmp/.ansible-cp

[ssh_connection]
# NOTE: SSH will prefer password auth
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o CheckHostIP=no -o UpdateHostKeys=no -o LogLevel=quiet -o PreferredAuthentications=password -o ControlMaster=auto -o ControlPersist=1200 -o

[inventory]
unparsed_if_failed = True
