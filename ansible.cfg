[defaults]
# debug = True
interpreter_python = /usr/bin/python3
inventory = /etc/ansible/hosts
vault_password_file = /etc/ansible/.vault_pass
log_path = /tmp/ansible.log
deprecation_warning = True
host_key_checking = False

[ssh_connection]
# NOTE: SSH will prefer password auth
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o CheckHostIP=no -o UpdateHostKeys=no -o LogLevel=quiet -o PreferredAuthentications=password

[inventory]
unparsed_if_failed = True
