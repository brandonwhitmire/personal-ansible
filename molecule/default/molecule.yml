---
# Molecule docs:
# - https://molecule.readthedocs.io/en/latest/examples.html
# Vagrant:
# - https://github.com/ansible-community/molecule-vagrant/blob/main/README.rst
dependency:
  name: galaxy
driver:
  name: vagrant
  # https://molecule.readthedocs.io/en/latest/examples.html#parallel-usage-example
  parallel: true  # It is currently only available for use with the Docker driver.
  provision: true
  provider:
    name: virtualbox
platforms:
  - name: arch_instance
    box: 'archlinux/archlinux'
    hostname: archvagrant.local
    config_options:
      ssh.remote_user: 'vagrant'
      ssh.keep_alive: true
    memory: 4096
    cpus: 2
    instance_raw_config_args:  # REQUIRES: driver -> provision: true
      - 'vm.provision :shell, inline: "pacman -S --noconfirm python sudo"'
  - name: kali_instance
    box: 'kalilinux/rolling'
    hostname: kalivagrant.local
    config_options:
      ssh.remote_user: 'vagrant'
      ssh.keep_alive: true
    memory: 4096
    cpus: 2
    provider_raw_config_args:
      - 'gui = false'  # prevent VM GUI from displaying
    # instance_raw_config_args:  # REQUIRES: driver -> provision: true
    #   - 'vm.provision :shell, inline: "apt update --yes && apt full-upgrade --yes"'
provisioner:
  name: ansible
  env:
    # https://www.jeffgeerling.com/blog/2020/getting-colorized-output-molecule-and-ansible-on-github-actions-ci
    PY_COLORS: '1'
    ANSIBLE_FORCE_COLOR: '1'
  config_options:
    defaults:
      vault_password_file: "${MOLECULE_PROJECT_DIRECTORY}/.vault_pass"
verifier:
  name: ansible
# lint: |
#   ansible-lint
