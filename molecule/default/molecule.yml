driver:
  name: libvirt

platforms:
  - name: arch-instance
    image: /var/lib/libvirt/images/Arch-Linux-x86_64-cloudimg.qcow2
    file_url: file:///var/lib/libvirt/images/Arch-Linux-x86_64-cloudimg.qcow2
    memory: 1024
    cpus: 1
    disk: 10
    network:
      - network: default
    cloud_init: false

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent

verifier:
  name: ansible
