# Molecule docs:
# - https://molecule.readthedocs.io/en/latest/examples.html
# Vagrant:
# - https://github.com/ansible-community/molecule-vagrant/blob/main/README.rst
---
dependency:
  name: galaxy
driver:
  name: vagrant
  # https://molecule.readthedocs.io/en/latest/examples.html#parallel-usage-example
  parallel: true  # currently only available for use with the Docker driver.
  provision: true
  provider:
    name: virtualbox
platforms:
  - name: arch-instance
    box: 'archlinux/archlinux'
    cpus: 2
    memory: 4096
    config_options:
      ssh.remote_user: 'vagrant'
      ssh.keep_alive: true
    instance_raw_config_args:  # REQUIRES: driver -> provision: true
      - 'vm.provision :shell, inline: "pacman -S \
                                         --refresh --sysupgrade --noconfirm \
                                           archlinux-keyring \
                                           python && \
                                       systemctl reboot --reboot-argument=now" '
  - name: kaliinstance
    hostname: kaliinstance.local
    box: 'kalilinux/rolling'
    cpus: 2
    memory: 4096
    config_options:
      ssh.remote_user: 'vagrant'
      ssh.keep_alive: true
    provider_raw_config_args:
      - 'gui = false'  # prevent VM GUI from displaying
    instance_raw_config_args:  # REQUIRES: driver -> provision: true
      - 'vm.provision :shell, inline: "echo COMMANDS ARE CURRENTLY SKIPPED || \
                                       apt update --yes && \
                                       apt full-upgrade --yes" '
provisioner:
  name: ansible
  env:
    # https://www.jeffgeerling.com/blog/2020/getting-colorized-output-molecule-and-ansible-on-github-actions-ci
    PY_COLORS: '1'
    ANSIBLE_FORCE_COLOR: '1'
    ANSIBLE_PYTHON_INTERPRETER: '/usr/bin/python3'
    ANSIBLE_TIMEOUT: 300
    ANSIBLE_PERSISTENT_COMMAND_TIMEOUT: 300
    ANSIBLE_PERSISTENT_CONNECT_RETRY_TIMEOUT: 15
  config_options:
    defaults:
      # Not used but prevents vault descryption errors
      vault_password_file: "${MOLECULE_PROJECT_DIRECTORY}/.vault_pass"
verifier:
  name: ansible
