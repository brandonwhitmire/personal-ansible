---
# Molecule docs:
# - https://molecule.readthedocs.io/en/latest/examples.html
# Vagrant:
# - https://github.com/ansible-community/molecule-vagrant/blob/main/README.rst
dependency:
  name: galaxy
driver:
  name: vagrant
  provision: true
  provider:
    name: virtualbox
platforms:
  - name: arch_instance
    box: 'archlinux/archlinux'
    hostname: archvagrant.local
      #    interfaces:
      #      - auto_config: true
      #        network_name: private_network
      #        type: dhcp
      #      - network_name: private_network
      #        ip: 192.168.56.100
      #      - network_name: forwarded_port
      #        host: 2222
      #        guest: 22
    config_options:
      ssh.remote_user: 'vagrant'
      ssh.keep_alive: true
    memory: 4096
    cpus: 2
    # REQUIRES: driver -> provision: true
    instance_raw_config_args:
      # AVOID: "--sysupgrade" for misaligned kernel versions b/t rolling updates
      - 'vm.provision :shell, inline: "pacman -S --refresh --refresh --noconfirm && pacman -S --noconfirm python sudo"'
  - name: kali_instance
    box: 'kalilinux/rolling'
    hostname: kalivagrant.local
    config_options:
      ssh.remote_user: 'vagrant'
      ssh.keep_alive: true
    memory: 4096
    cpus: 2
provisioner:
  name: ansible
  env:
    # https://www.jeffgeerling.com/blog/2020/getting-colorized-output-molecule-and-ansible-on-github-actions-ci
    PY_COLORS: '1'
    ANSIBLE_FORCE_COLOR: '1'
    # https://docs.ansible.com/ansible/latest/reference_appendices/config.html#default-timeout
    # ANSIBLE_TIMEOUT: 180
    # ANSIBLE_PERSISTENT_COMMAND_TIMEOUT: 180
    # ANSIBLE_PERSISTENT_CONNECT_RETRY_TIMEOUT: 120
    # ANSIBLE_CONFIG: 'ansible.cfg'
  config_options:
    defaults:
      vault_password_file: "${MOLECULE_PROJECT_DIRECTORY}/.vault_pass"
verifier:
  name: ansible
# lint: |
#   ansible-lint
