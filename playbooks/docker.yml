#!/usr/bin/env ansible-playbook
#
# Install Docker
#
# Reference:
# https://wiki.archlinux.org/title/Docker#Installation
---
- name: Install Docker
  hosts: all
  tasks:

  - name: Install needed OS pkgs
    become: true
    community.general.pacman:
      name:
        - docker
        - docker-compose
      state: present

  - name: Enable Docker service
    become: true
    ansible.builtin.service:
      name: docker
      enabled: true
      state: started

  - name: Add `{{ ansible_user }}` to docker group
    become: true
    ansible.builtin.user:
      name: '{{ ansible_user }}'
      groups: docker
      append: true
      state: present
