# Reference:
# https://www.protondb.com/app/813780#T4QkvqCK-9
---
- name: AOE2 Fix multiplayer desync
  hosts: all

  vars:
  - aoe2_dir: /home/{{ ansible_user }}/.steam/steam/steamapps/compatdata/813780/pfx/drive_c/windows/system32
  - vc_redist_exe: vc_redist.x64.exe
  - vc_redist_url: https://download.microsoft.com/download/9/3/F/93FCF1E7-E6A4-478B-96E7-D4B285925B00/{{ vc_redist_exe }}

  tasks:

  - name: === AOE2 Block ===
    block:

      - name: Install necessary pkgs
        become: true
        community.general.pacman:
          name:
            - cabextract
          state: present

      - name: Ensure proper AOE2 folder exists
        ansible.builtin.file:
          path: '{{ aoe2_dir }}'
          state: directory
          mode: '0644'

      - name: Download vc_redist file
        ansible.builtin.get_url:
          url: '{{ vc_redist_url }}'
          dest: '{{ aoe2_dir }}'
          # force: true
          checksum: sha256:5eea714e1f22f1875c1cb7b1738b0c0b1f02aec5ecb95f0fdb1c5171c6cd93a3

      - name: Extract from downloaded file
        become: true
        ansible.builtin.command:
          cmd: cabextract {{ vc_redist_exe }}
          chdir: '{{ aoe2_dir }}'

      - name: Extract from extracted file
        become: true
        ansible.builtin.command:
          cmd: cabextract a10
          chdir: '{{ aoe2_dir }}'

      - name: chown to normal user
        become: true
        ansible.builtin.file:
          owner: '{{ ansible_user }}'
          group: '{{ ansible_user }}'
          path: '{{ aoe2_dir }}'
          recurse: true
          state: directory
