#!/usr/bin/env ansible-playbook
#
# Barebones setup to make a fresh box usable
---
- hosts: all
  tasks:
    - name: Target OS
      ansible.builtin.debug:
        msg: 'TARGET OS: {{ ansible_facts["distribution"] }}'

# Arch Linux is the default distro; Kali is secondarily supported
# Arch: https://archlinux.org/packages/ | https://aur.archlinux.org/
- when: ansible_facts["distribution"] == "Archlinux"
  ansible.builtin.import_playbook: baseline_arch.yml

# Kali: https://pkg.kali.org
- when: ansible_facts["distribution"] == "Kali"
  ansible.builtin.import_playbook: baseline_kali.yml
