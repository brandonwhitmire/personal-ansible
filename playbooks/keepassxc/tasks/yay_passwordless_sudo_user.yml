#!/usr/bin/env ansible-playbook
---
- name: Add/Remove yay passwordless sudo user (to install AUR packages)
  hosts: all
  vars:
  - passwordless_sudo_user: aur_builder
  tasks:
  - name: Create the `aur_builder` user
    become: true
    ansible.builtin.user:
      name: '{{ passwordless_sudo_user }}'
      create_home: false
      group: wheel
      state: present
  - name: Allow the `aur_builder` user to run `sudo pacman` without a password
    become: true
    ansible.builtin.lineinfile:
      path: /etc/sudoers.d/11-install-aur_builder
      line: '{{ passwordless_sudo_user }} ALL=(ALL) NOPASSWD: /usr/bin/pacman'
      create: true
      validate: 'visudo -cf %s'
      state: present
