#!/usr/bin/env ansible-playbook
#
# Barebones setup to make a fresh box usable
---
- name: Install baseline pkgs
  hosts: all
  tasks:

    - name: Update apt cache if the last is more than 3600 seconds ago
      become: true
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Gather the package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Avoid pkg conflict ('acpilight' overwrites *xbacklight* from 'xorg')
      become: true
      ansible.builtin.package:
        name: xorg  # desktop GUI
        state: present
      when: "'acpilight' not in ansible_facts.packages"

    - name: Install baseline pkgs
      become: true
      ansible.builtin.package:
        name:
          - xdg-user-dirs  # common user dirs
          - xinit  # start GUI
          - picom  # xorg compositor
          - xterm  # default terminal
          - ttf-bitstream-vera  # serif and mono
          - fonts-dejavu  # Bitstream Vera modified w/more Unicode
          - fonts-croscore  # Helvetica, Times, and Courier
          - xautolock  # xorg locker
          - policykit-1  # privs management
          - dmidecode  # used for checking for virtualization
          - firefox-esr  # web browser
          - chromium  # web browser
          - gedit  # text editor
          - flameshot  # screenshot
          - strace  # debugger
          - bind9  # domain resolving
          - udisks2  # disk mounting
          - arandr  # desktop display configurator
          - git  # repos
          - python3  # Python3
          - python3-pip  # pip package installer
          - python3-setuptools  # Python3 setuptools
          - numlockx  # numlock on at login
          - ghostwriter  # Markdown editor
          - libreoffice  # office suite of programs
          - pulseaudio  # PulseAudio
          - pavucontrol  # PulseAudio GUI for volume
          - packer  # automate VM building
          - man-db  # manpages program
          - manpages  # actual manpages
          - blueman  # Bluetooth
          - dialog  # for wifi-menu
          - netctl  # dep for wifi-menu
          - pcmanfm  # file explorer GUI
          - gvfs  # dep for pcmanfm features
          - unzip  # zip
          - evince  # PDF viewer
          - bluez  # bluetooth
          - xserver-xorg-input-synaptics  # touchpad
          - android-file-transfer  # access files from Android device
        state: present

    - name: Enable baseline services
      become: true
      ansible.builtin.service:
        name: '{{ item }}'
        enabled: true
        state: started
      loop:
        - bluetooth

    - name: Disable bluetooth on boot
      become: true
      vars:
        bluetooth_enabled: 'false'
      ansible.builtin.lineinfile:
        backup: true
        backrefs: true
        path: /etc/bluetooth/main.conf
        regexp: '^#\s*(AutoEnable)=.*$'
        line: '\1={{ bluetooth_enabled }}'
        state: present

    - name: Set default systemd service timeout
      become: true
      ansible.builtin.blockinfile:
        path: /etc/systemd/system.conf
        marker: "# {mark} systemd_timeout"
        create: true
        state: present
        mode: '0644'
        block: |
          DefaultTimeoutStopSec=15s

    - name: Set Chromium to use GTK theme
      ignore_errors: true
      ansible.builtin.lineinfile:
        backup: true
        backrefs: true
        path: ~/.config/chromium/Default/Preferences
        regexp: '(.*)"system_theme":0(.*)'
        line: '\1 "system_theme":1 \2'
        state: present

    # https://wiki.archlinux.org/title/Touchpad_Synaptics#Frequently_used_options
    - name: Configure touchpad to use sane defaults
      become: true
      ansible.builtin.copy:
        remote_src: false
        src: files/70-synaptics.conf
        dest: /etc/X11/xorg.conf.d/
        mode: '0644'
        owner: root
        group: root

    - name: Change default sudo prompt timeout
      become: true
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/sudo_prompt_timeout
        line: Defaults timestamp_timeout=15
        create: true
        validate: 'visudo --check --strict --file=%s'
        mode: '0440'
        owner: root
        group: root
        state: present
