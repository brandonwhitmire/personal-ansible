#!/usr/bin/env ansible-playbook
#
# Setup virtualization
---
- name: Install baseline pkgs
  hosts: all
  vars:
    vbox: true
    qemu: false
  tasks:

    # !!! === Do NOT DELETE (configures VM guest instead of host) === !!!
    # https://wiki.archlinux.org/index.php/VirtualBox/Install_Arch_Linux_as_a_guest
    - name: Check for Virtualbox virtualization (VM running inside of vbox)
      become: true
      changed_when: false
      ignore_errors: true
      ansible.builtin.shell:
        cmd: dmidecode | grep --ignore-case --quiet --extended-regexp 'virtualbox|vbox'
      register: is_virtualbox

    - name: === Host (hypervisor) actions ===
      when: is_virtualbox.rc != 0
      block:

        # https://wiki.archlinux.org/title/VirtualBox
        - name: --- Virtualbox ---
          when: vbox|bool
          block:

            - name: Install virtualbox pkgs
              become: true
              community.general.pacman:
                name:
                  - virtualbox
                  - virtualbox-host-modules-arch
                state: present
                  
            # https://wiki.archlinux.org/title/VirtualBox#Accessing_host_USB_devices_in_guest
            - name: Add user to vboxusers group
              become: true
              ansible.builtin.user:
                name: '{{ ansible_user }}'
                groups: vboxusers
                append: true
                state: present

            # https://wiki.archlinux.org/title/VirtualBox#Load_the_VirtualBox_kernel_modules
            - name: Enable VirtualBox kernel modules
              become: true
              community.general.modprobe:
                name: '{{ item }}'
                state: present
              loop:
                - vboxdrv
                - vboxnetadp
                - vboxnetflt

        # https://wiki.archlinux.org/title/QEMU
        - name: --- QEMU ---
          when: qemu|bool
          block:

            - name: Install qemu pkgs
              become: true
              community.general.pacman:
                name:
                  - qemu-full
                state: present

    - name: === Guest (virtual machines) actions ===
      when: is_virtualbox.rc == 0
      block:

        - name: Install Virtualbox Guest and NFS customizations
          become: true
          ansible.builtin.pacman:
            name:
              - virtualbox-guest-utils
              - nfs-utils
            state: present

        - name: Enable Guest Additions and NFS services
          become: true
          ansible.builtin.service:
            name: '{{ item }}'
            state: started
            enabled: true
          loop:
            - vboxservice
            - rpcbind

        - name: Add `{{ ansible_user }}` to vboxsf group
          become: true
          ansible.builtin.user:
            name: '{{ ansible_user }}'
            groups: vboxsf
            append: true
            state: present

        # https://wiki.archlinux.org/title/VirtualBox/Install_Arch_Linux_as_a_guest#Launch_the_VirtualBox_guest_services
        - name: Run VBox guest services on start
          ansible.builtin.lineinfile:
            path: ~/.config/i3/config
            line: exec_always VBoxClient-all
            create: true
            state: present
