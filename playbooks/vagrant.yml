#!/usr/bin/env ansible-playbook
#
# Install Vagrant (VM manager)
#
# Reference:
# https://wiki.archlinux.org/title/Vagrant#Installation
---
- name: Install Vagrant
  hosts: all
  tasks:

  - name: Install needed OS pkgs
    become: true
    community.general.pacman:
      name:
        - vagrant
        - libvirt
        - qemu
        - virt-manager
        - nfs-utils
        - dnsmasq
        - dmidecode
      state: present

  - name: Install needed pip3 pkgs
    ansible.builtin.pip:
      name:
        - paramiko  # SSH-like library used for dynamic inventory

  - name: Enable libvirtd service
    become: true
    ansible.builtin.service:
      name: libvirtd
      enabled: true
      state: started

    # https://wiki.archlinux.org/title/Vagrant#Mounting_NFS_shared_folders:_mount.nfs:_requested_NFS_version_or_transport_protocol_is_not_supported
  - name: '`nfs.conf` enable vers3'
    become: true
    ansible.builtin.lineinfile:
      path: /etc/nfs.conf
      regexp: '^#\s*vers3.*$'
      line: vers3=y
      state: present

  - name: '`nfs.conf` enable UDP'
    become: true
    ansible.builtin.lineinfile:
      path: /etc/nfs.conf
      regexp: '^#\s*udp=.*$'
      line: udp=y
      state: present

    # https://wiki.archlinux.org/title/Vagrant#Mounting_NFS_shared_folders:_mount.nfs:_requested_NFS_version_or_transport_protocol_is_not_supported
  - name: Enable nfs-server service
    become: true
    ansible.builtin.service:
      name: nfs-server
      enabled: true
      state: restarted
      sleep: 3

  - name: Check if libvirt plugin is installed
    ansible.builtin.command:
      cmd: vagrant plugin list
    register: output_vagrant_plugin_list
    changed_when: output_vagrant_plugin_list.rc != 0

  - name: Show Vagrant plugin list
    ansible.builtin.debug:
      msg:
        - "=== START  :: vagrant plugin list output ==="
        - "{{ output_vagrant_plugin_list.stdout }}"
        - "=== END    :: vagrant plugin list output ==="

  - name: Install libvirt plugin for Vagrant, if absent
    ansible.builtin.command:
      cmd: vagrant plugin install vagrant-libvirt
    when: output_vagrant_plugin_list.stdout is not regex(".*vagrant-libvirt.*")

  - name: Add '{{ ansible_user }}' to libvirt group
    become: true
    ansible.builtin.user:
      name: '{{ ansible_user }}'
      groups: libvirt
      append: true
      state: present
