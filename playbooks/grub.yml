#!/usr/bin/env ansible-playbook
#
# Configure GRUB
---
- name: Configure GRUB bootloader
  hosts: all

  tasks:

    # Reference: https://stackoverflow.com/questions/55844981/ansible-insert-word-in-grub-cmdline
    - name: Check if GRUB splash exists in boot command
      become: true
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX=".*splash'
        state: absent
      check_mode: true
      register: grub_cmdline_check
      changed_when: false

    - name: Insert GRUB splash if missing
      become: true
      ansible.builtin.lineinfile:
        backup: true
        backrefs: true
        path: /etc/default/grub
        regexp: "^(GRUB_CMDLINE_LINUX=\".*)\"$"
        line: '\1 noquiet splash=verbose"'
        state: present
      when: grub_cmdline_check.found == 0
      notify: Update GRUB

    - name: Change GRUB timeout to 0
      become: true
      ansible.builtin.replace:
        backup: true
        path: /etc/default/grub
        regexp: '^GRUB_TIMEOUT=[1-9][0-9]*'
        replace: "GRUB_TIMEOUT=0"
      notify: Update GRUB

    # https://wiki.archlinux.org/title/Getty#Have_boot_messages_stay_on_tty1
    - name: Keep boot messages on tty1
      block:

        - become: true
          ansible.builtin.file:
            path: /etc/systemd/system/getty@tty1.service.d/
            state: directory
            mode: '0755'

        - become: true
          ansible.builtin.blockinfile:
            path: /etc/systemd/system/getty@tty1.service.d/noclear.conf
            create: true
            mode: '0644'
            marker: '# {mark} systemd_noclear_rc'
            state: present
            block: |
              [Service]
              TTYVTDisallocate=no

  handlers:

    - name: Update GRUB
      become: true
      ansible.builtin.command:
        cmd: grub-mkconfig -o /boot/grub/grub.cfg
