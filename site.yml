---
- name: Discern target OS
  hosts: all
  tasks:
    - name: Target OS
      ansible.builtin.debug:
        msg: 'TARGET OS: {{ ansible_facts["distribution"] }}'

- name: Apply baseline configuration
  hosts: all
  roles:
    - baseline
    - arch_recommendations
    - i3
    - shell
    - theme
    - conky
    - nitrogen
    - keepassxc
    - powertop
    - locale
    - docker
    - grub
    - calibre
    - virtualization
    - vagrant
    # NOTE: steam must be at the end since it upgrades the system,
    # which breaks some other things until a reboot is completed
    - steam
