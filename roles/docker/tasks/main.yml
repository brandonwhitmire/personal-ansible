# moved from playbooks/docker.yml on 2024-12-19
---
- name: Install needed OS pkgs
  become: true
  ansible.builtin.package:
    name:
      - docker
      - docker-compose
    state: present

- name: Enable Docker service
  become: true
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: 'Add {{ ansible_user }} to docker group'
  become: true
  ansible.builtin.user:
    name: '{{ ansible_user }}'
    groups: docker
    append: true
    state: present
