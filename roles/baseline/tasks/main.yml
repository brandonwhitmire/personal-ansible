# https://wiki.archlinux.org/title/Touchpad_Synaptics#Frequently_used_options
- name: Configure touchpad to use sane defaults
  become: true
  ansible.builtin.copy:
    remote_src: false
    src: files/70-synaptics.conf
    dest: /etc/X11/xorg.conf.d/
    mode: '0644'
    owner: root
    group: root

- name: Change default sudo prompt timeout
  become: true
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/sudo_prompt_timeout
    line: Defaults timestamp_timeout=15
    create: true
    validate: 'visudo --check --strict --file=%s'
    mode: '0440'
    owner: root
    group: root
    state: present
