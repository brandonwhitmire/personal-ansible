#          - neovim  # used by neovim

- name: Add functionality for shells
  ansible.builtin.blockinfile:
    path: '/home/{{ ansible_user }}/{{ item }}'
    marker: "# {mark} zsh_rc"
    block: "{{ lookup('file', 'files/zsh_rc') }}"
    create: true
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0644'
    state: present
  loop:
    - .zshrc
    # - .bashrc

- name: Copy custom zsh_rc to root
  become: true
  ansible.builtin.copy:
    backup: true
    remote_src: true
    src: '/home/{{ ansible_user }}/{{ item }}'
    dest: '/root/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - .zshrc
    # - .bashrc

- name: 'Set default shell to zsh for users root and {{ ansible_user }}'
  become: true
  ansible.builtin.user:
    name: '{{ item }}'
    shell: /usr/bin/zsh
  loop:
    - '{{ ansible_user }}'
    - root

- name: Build pkgfile cache (first time only)
  become: true
  ansible.builtin.command:
    cmd: pkgfile --update
    creates: /var/cache/pkgfile/

- name: Ensure nvim directory exists
  ansible.builtin.file:
    path: ~/.config/nvim/
    state: directory
    mode: '0755'

# https://nvchad.com/docs/quickstart/install#install
- name: 'Clone nvChad to profile: {{ ansible_user }}'  # noqa latest[git]
  ansible.builtin.git:
    repo: https://github.com/NvChad/starter
    dest: ~/.config/nvim
  register: shell_nvchad_cloned

- name: Initialize nvim
  ansible.builtin.command:
    cmd: nvim --headless '+qa'
  when: shell_nvchad_cloned.changed
  changed_when: false
  failed_when: false

- name: Sync nvim plugins with Lazy
  ansible.builtin.command:
    cmd: nvim --headless '+lua require("lazy").sync()' '+qa'
  changed_when: false
  failed_when: false

- name: Install Mason packages
  ansible.builtin.command:
    cmd: nvim --headless '+MasonInstallAll' '+qa'
  changed_when: false
  failed_when: false

- name: Ensure alacritty directory exists
  ansible.builtin.file:
    path: ~/.config/alacritty/
    state: directory
    mode: '0755'

- name: Set default font for terminal `alacritty`
  ansible.builtin.copy:
    force: true
    src: files/alacritty.toml
    dest: ~/.config/alacritty/alacritty.toml
    mode: '0644'

- name: Template /etc/environment
  become: true
  ansible.builtin.blockinfile:
    path: /etc/environment
    marker: '# {mark} environment_config'
    block: |
      EDITOR=/usr/bin/nvim
      BROWSER={{ shell_default_browser_fullpath }}
      TERMINAL=/usr/bin/alacritty
    create: true
    state: present
    mode: '0644'
    owner: root
    group: root

- name: 'Template {{ shell_mimeapps_file }}'
  ansible.builtin.blockinfile:
    path: '{{ shell_mimeapps_file }}'
    marker: '# {mark} mimeapps_list_config'
    block: |
      [Default Applications]
      text/html={{ shell_default_browser_name }}.desktop
      x-scheme-handler/http={{ shell_default_browser_name }}.desktop
      x-scheme-handler/https={{ shell_default_browser_name }}.desktop
      x-scheme-handler/ftp={{ shell_default_browser_name }}.desktop
      x-scheme-handler/chrome={{ shell_default_browser_name }}.desktop
      application/x-extension-htm={{ shell_default_browser_name }}.desktop
      application/x-extension-html={{ shell_default_browser_name }}.desktop
      application/x-extension-shtml={{ shell_default_browser_name }}.desktop
      application/xhtml+xml={{ shell_default_browser_name }}.desktop
      application/x-extension-xhtml={{ shell_default_browser_name }}.desktop
      application/x-extension-xht={{ shell_default_browser_name }}.desktop
      image/jpeg={{ shell_default_image_viewer }}.desktop
      image/png={{ shell_default_image_viewer }}.desktop
    create: true
    state: present
    mode: '0644'

- name: Copy starship configuration
  become: false
  ansible.builtin.copy:
    force: true
    src: files/starship.toml
    dest: ~/.config/starship.toml
    mode: '0644'

- name: Ensure display config directory exists
  become: false
  ansible.builtin.file:
    path: ~/.config/display/
    state: directory
    mode: '0755'

- name: Create display restore script
  become: false
  ansible.builtin.copy:
    src: restore-display.sh
    dest: ~/.config/display/restore-display.sh
    mode: '0755'
    force: true

- name: Create .xprofile to restore displays early in X session
  become: false
  ansible.builtin.template:
    src: xprofile.j2
    dest: ~/.xprofile
    mode: '0755'
    force: true
