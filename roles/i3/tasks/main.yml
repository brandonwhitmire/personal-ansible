---
# i3 window manager setup
#
# Boot Sequence:
# systemd boot -> agetty (autologin into user) -> zsh (sources .zshrc) -> startx (sources .xinitrc) -> i3
#
- name: Check if Nvidia GPU is present
  become: false
  ansible.builtin.shell: |
    lspci | grep -i nvidia > /dev/null 2>&1
  register: nvidia_gpu_check
  changed_when: false
  failed_when: false

- name: Set fact for Nvidia GPU presence
  ansible.builtin.set_fact:
    has_nvidia_gpu: "{{ nvidia_gpu_check.rc == 0 }}"

- name: Install i3 pkgs
  become: true
  ansible.builtin.package:
    name:
      - i3  # metapackage of various i3 packages
      - dunst  # system notifications
    state: present

# https://wiki.archlinux.org/title/Getty#Virtual_console
- name: Ensure systemd folder for autologin exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/getty@tty1.service.d/
    owner: root
    group: root
    mode: '0755'
    state: directory

- name: Systemd unitfile for autologin via agetty
  become: true
  ansible.builtin.blockinfile:
    path: /etc/systemd/system/getty@tty1.service.d/autologin.conf
    marker: '# {mark} agetty_autologin'
    block: |
      [Service]
      ExecStart=
      {% if has_nvidia_gpu | bool %}
      # https://github.com/Askannz/optimus-manager/wiki/FAQ,-common-issues,-troubleshooting#i-do-not-use-a-display-manager-i-use-startx-or-xinit
      ExecStartPre=-/usr/bin/prime-switch
      {% endif %}
      ExecStart=-/sbin/agetty --autologin {{ ansible_user }} --noclear %I 38400 linux
    owner: root
    group: root
    mode: '0644'
    create: true
    state: present

- name: Startx i3 upon (auto)login
  become: false
  ansible.builtin.blockinfile:
    path: ~/.xinitrc
    marker: "# {mark} .xinitrc"
    block: |
      {% if has_nvidia_gpu | bool %}
      # https://github.com/Askannz/optimus-manager/wiki/FAQ,-common-issues,-troubleshooting#i-do-not-use-a-display-manager-i-use-startx-or-xinit
      if command -v prime-offload >/dev/null 2>&1; then
          /usr/bin/prime-offload
      fi
      {% endif %}
      # Restore display configuration before starting i3
      if [ -f "$HOME/.config/display/restore-display.sh" ]; then
          "$HOME/.config/display/restore-display.sh" 2>/dev/null
      fi
      exec i3
    mode: '0644'
    create: true
    state: present

- name: Ensure i3 config dir is present
  become: false
  ansible.builtin.file:
    path: ~/.config/i3/
    state: directory
    mode: '0755'

- name: Copy default i3 file to `{{ ansible_user }}` profile
  become: false
  ansible.builtin.template:
    src: i3_rc.j2
    dest: ~/.config/i3/config
    mode: '0644'
    backup: true
  register: i3_config_changed

- name: Ensure i3 scripts directory exists
  become: false
  ansible.builtin.file:
    path: ~/.config/i3/scripts/
    state: directory
    mode: '0755'

- name: Copy powermenu script (template)
  become: false
  ansible.builtin.template:
    force: true
    src: powermenu.sh.j2
    dest: ~/.config/i3/scripts/powermenu.sh
    mode: '0755'
  register: i3_config_changed

- name: Copy autostart script (template)
  become: false
  ansible.builtin.template:
    force: true
    src: autostart.sh.j2
    dest: ~/.config/i3/scripts/autostart.sh
    mode: '0755'
  register: i3_config_changed

- name: Install AUR pkgs
  vars:
    function_yay_aur_packages:
      - pa-applet-git  # applet for PulseAudio
  ansible.builtin.import_role:
    name: function_yay

# Validate i3 configuration syntax using i3 built-in check
- name: Verify i3 configuration syntax
  become: false
  ansible.builtin.command: i3 -C -c ~/.config/i3/config
  when: i3_config_changed is defined and i3_config_changed.changed
  changed_when: false

- name: Check if i3 is running and ready
  become: false
  ansible.builtin.shell: |
    set -o pipefail
    # Check if i3 process exists
    if ! pgrep -x i3 > /dev/null; then
      exit 1
    fi
    # Verify i3 socket is accessible by trying a simple command
    # This will fail if DISPLAY is not set or socket is not ready
    i3-msg -t get_version > /dev/null 2>&1
  register: i3_ready
  failed_when: false
  changed_when: false
  environment:
    DISPLAY: "{{ ansible_env.DISPLAY | default(':0') }}"

- name: Reload i3 configuration
  become: false
  ansible.builtin.command: i3-msg reload
  changed_when: false
  retries: 3
  delay: 2
  register: i3_reload_result
  until: i3_reload_result.rc == 0
  when:
    - i3_config_changed is defined and i3_config_changed.changed
    - i3_ready is defined and i3_ready.rc == 0
  environment:
    DISPLAY: "{{ ansible_env.DISPLAY | default(':0') }}"
