---
# i3 window manager setup
#
# Boot Sequence:
# systemd boot -> agetty (autologin into user) -> zsh (sources .zshrc) -> startx (sources .xinitrc) -> i3
#
- name: Install i3 pkgs
  become: true
  ansible.builtin.package:
    name:
      - i3  # metapackage of various i3 packages
      - dunst  # system notifications
    state: present

# https://wiki.archlinux.org/title/Getty#Virtual_console
- name: Ensure systemd folder for autologin exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/getty@tty1.service.d/
    owner: root
    group: root
    mode: '0755'
    state: directory

- name: Systemd unitfile for autologin via agetty
  become: true
  ansible.builtin.blockinfile:
    path: /etc/systemd/system/getty@tty1.service.d/autologin.conf
    marker: '# {mark} agetty_autologin'
    block: |
      [Service]
      ExecStart=
      # https://github.com/Askannz/optimus-manager/wiki/FAQ,-common-issues,-troubleshooting#i-do-not-use-a-display-manager-i-use-startx-or-xinit
      ExecStartPre=-/usr/bin/prime-switch
      ExecStart=-/sbin/agetty --autologin {{ ansible_user }} --noclear %I 38400 linux
    owner: root
    group: root
    mode: '0644'
    create: true
    state: present

- name: Startx i3 upon (auto)login
  become: false
  ansible.builtin.blockinfile:
    path: ~/.xinitrc
    marker: "# {mark} .xinitrc"
    block: |
      /usr/bin/prime-offload  # https://github.com/Askannz/optimus-manager/wiki/FAQ,-common-issues,-troubleshooting#i-do-not-use-a-display-manager-i-use-startx-or-xinit
      exec i3
    mode: '0644'
    create: true
    state: present

- name: Ensure i3 config dir is present
  become: false
  ansible.builtin.file:
    path: ~/.config/i3/
    state: directory
    mode: '0755'

- name: Copy default i3 file to `{{ ansible_user }}` profile
  become: false
  ansible.builtin.copy:
    src: files/i3_rc
    dest: ~/.config/i3/config
    mode: '0644'
    backup: true
  register: i3_config_changed

- name: Ensure i3status config directory exists
  become: false
  ansible.builtin.file:
    path: ~/.config/i3status/
    state: directory
    mode: '0755'

- name: Copy i3status config file
  become: false
  ansible.builtin.copy:
    force: true
    src: files/i3status_rc
    dest: ~/.config/i3status/config
    mode: '0644'
  register: i3_config_changed

- name: Ensure i3 scripts directory exists
  become: false
  ansible.builtin.file:
    path: ~/.config/i3/scripts/
    state: directory
    mode: '0755'

- name: Copy i3 scripts
  become: false
  ansible.builtin.copy:
    force: true
    src: "files/{{ item }}"
    dest: "~/.config/i3/scripts/{{ item }}"
    mode: '0755'
  loop:
    - powermenu.sh
    - autostart.sh
  register: i3_config_changed

- name: Install AUR pkgs
  vars:
    function_yay_aur_packages:
      - dmenu2  # keyboard-driven app launcher
      - pa-applet-git  # applet for PulseAudio
  ansible.builtin.import_role:
    name: function_yay

# Requires dmenu to be installed first
- name: Install dmenu history patch
  become: true
  ansible.builtin.get_url:
    url: https://tools.suckless.org/dmenu/scripts/dmenu_run_with_command_history/dmenu_run_history
    dest: /usr/local/bin/
    checksum: sha256:e46ab822e1809f82f6a71e705087d40ebb95cfb828839b860bccb8904634df09
    mode: '0755'

# Validate i3 configuration syntax using i3 built-in check
- name: Verify i3 configuration syntax
  become: false
  ansible.builtin.command: i3 -C -c ~/.config/i3/config
  when: i3_config_changed is defined and i3_config_changed.changed
  changed_when: false

- name: Check if i3 is running
  become: false
  ansible.builtin.command: pgrep -x i3
  register: i3_running
  failed_when: false
  changed_when: false

- name: Reload i3 configuration
  become: false
  ansible.builtin.command: i3-msg reload
  changed_when: false
  when:
    - i3_config_changed is defined and i3_config_changed.changed
    - i3_running is defined and i3_running.rc == 0
